name: Linux 패키지 릴리스

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "패키지 버전 (예: 1.31.4.1, util/ver와 일치해야 함)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: rs
  COMMAND_NAME: rs
  JOBS: "3"
  PCRE_VER: "10.47"
  PCRE_SHA256: "c08ae2388ef333e8403e670ad70c0a11f1eed021fd88308d7e02f596fcd9dc16"
  PCRE_PREFIX: /opt/pcre2
  PCRE_LIB: /opt/pcre2/lib
  PCRE_INC: /opt/pcre2/include
  OPENSSL_VER: "3.5.6"
  OPENSSL_SHA256: "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"
  OPENSSL_PATCH_VER: "3.5.5"
  OPENSSL_PREFIX: /opt/ssl3
  OPENSSL_LIB: /opt/ssl3/lib
  OPENSSL_INC: /opt/ssl3/include
  OPENRESTY_PREFIX: /opt/openresty

jobs:
  package:
    name: ${{ matrix.goarch }} 패키지 빌드
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-22.04
            debarch: amd64
            rpmarch: x86_64
            archarch: x86_64

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 릴리스 버전 확인
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          SOURCE_VERSION="$(./util/ver)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#v}"
            TRIGGER_NAME="수동 입력"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TRIGGER_NAME="태그"
          fi

          if [ -z "$VERSION" ]; then
            echo "패키지 버전이 비어 있습니다."
            exit 1
          fi

          # 입력값을 로그에 그대로 찍지 않는다. 줄 머리의 :: 가 워크플로 명령으로 해석될 수 있다.
          VERSION_RE='^[0-9A-Za-z][0-9A-Za-z.+~_-]*$'
          if [[ ! "$VERSION" =~ $VERSION_RE ]]; then
            echo "지원하지 않는 버전 형식입니다."
            exit 1
          fi

          if [ "$VERSION" != "$SOURCE_VERSION" ]; then
            echo "$TRIGGER_NAME 버전과 OpenResty 소스 버전($SOURCE_VERSION)이 일치하지 않습니다."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "빌드 버전: $VERSION"
          echo "릴리스 태그: v$VERSION"

      - name: 빌드 및 패키징 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            axel \
            build-essential \
            ca-certificates \
            dos2unix \
            git \
            libarchive-tools \
            libgd-dev \
            libpcre3 \
            libpcre3-dev \
            libpq-dev \
            mercurial \
            patch \
            perl \
            rpm \
            ruby-dev \
            wget \
            zlib1g-dev \
            zstd
          sudo gem install fpm --no-document

      - name: 다운로드 캐시 준비
        run: mkdir -p download-cache

      - name: 소스 아카이브 캐시
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: download-cache
          key: package-release-${{ matrix.goarch }}-${{ env.PCRE_VER }}-${{ env.OPENSSL_VER }}-${{ hashFiles('util/mirror-tarballs') }}
          restore-keys: |
            package-release-${{ matrix.goarch }}-${{ env.PCRE_VER }}-${{ env.OPENSSL_VER }}-
            package-release-${{ matrix.goarch }}-

      - name: PCRE2 빌드
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "download-cache/pcre2-$PCRE_VER.tar.gz" ]; then
            wget -P download-cache "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE_VER}/pcre2-${PCRE_VER}.tar.gz"
          fi

          # 내려받은 직후와 캐시 적중 모두 같은 해시로 검사한다. 어긋나면 캐시 파일을 지우고 멈춘다.
          if ! echo "$PCRE_SHA256  download-cache/pcre2-$PCRE_VER.tar.gz" | sha256sum -c -; then
            rm -f "download-cache/pcre2-$PCRE_VER.tar.gz"
            echo "PCRE2 소스의 해시가 기대값과 다릅니다."
            exit 1
          fi

          rm -rf "pcre2-$PCRE_VER"
          tar zxf "download-cache/pcre2-$PCRE_VER.tar.gz"
          cd "pcre2-$PCRE_VER"
          ./configure \
            --prefix="$PCRE_PREFIX" \
            --enable-jit \
            --enable-utf \
            --enable-unicode-properties
          make "-j$JOBS"
          sudo env PATH="$PATH" make install

      - name: OpenSSL 빌드
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "download-cache/openssl-$OPENSSL_VER.tar.gz" ]; then
            wget -P download-cache "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VER}/openssl-${OPENSSL_VER}.tar.gz"
          fi

          # 내려받은 직후와 캐시 적중 모두 같은 해시로 검사한다. 어긋나면 캐시 파일을 지우고 멈춘다.
          if ! echo "$OPENSSL_SHA256  download-cache/openssl-$OPENSSL_VER.tar.gz" | sha256sum -c -; then
            rm -f "download-cache/openssl-$OPENSSL_VER.tar.gz"
            echo "OpenSSL 소스의 해시가 기대값과 다릅니다."
            exit 1
          fi

          rm -rf "openssl-$OPENSSL_VER"
          tar zxf "download-cache/openssl-$OPENSSL_VER.tar.gz"
          cd "openssl-$OPENSSL_VER"
          patch -p1 < "../patches/openssl-$OPENSSL_PATCH_VER-sess_set_get_cb_yield.patch"
          ./config \
            no-threads \
            shared \
            --libdir=lib \
            --prefix="$OPENSSL_PREFIX"
          make "-j$JOBS"
          sudo make PATH="$PATH" install_sw

      - name: OpenResty 빌드 및 설치
        shell: bash
        run: |
          set -euo pipefail

          sudo ln -sf /usr/bin/make /usr/bin/gmake
          util/mirror-tarballs

          cd "openresty-$(./util/ver)"
          ./configure \
            --with-http_v3_module \
            --with-stream_realip_module \
            --with-http_realip_module \
            --prefix="$OPENRESTY_PREFIX" \
            --with-cc-opt="-I$PCRE_INC -I$OPENSSL_INC" \
            --with-ld-opt="-L$PCRE_LIB -L$OPENSSL_LIB -Wl,-rpath,$PCRE_LIB:$OPENSSL_LIB" \
            --with-pcre-jit \
            --with-http_ssl_module \
            "-j$JOBS"
          make "-j$JOBS"
          sudo make install

      - name: 빌드 결과 확인
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$OPENRESTY_PREFIX/bin:$OPENRESTY_PREFIX/nginx/sbin:$PATH"
          openresty -V
          sudo "$OPENRESTY_PREFIX/nginx/sbin/nginx" -t
          ldd "$(command -v openresty)" | grep -E 'luajit|ssl|crypto|pcre' || true

      - name: 패키지 루트 구성
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package-root release
          mkdir -p package-root/opt package-root/usr/bin release

          sudo cp -a "$OPENRESTY_PREFIX" package-root/opt/openresty
          sudo cp -a "$PCRE_PREFIX" package-root/opt/pcre2
          sudo cp -a "$OPENSSL_PREFIX" package-root/opt/ssl3

          install -m 0755 \
            package-root/opt/openresty/nginx/sbin/nginx \
            "package-root/usr/bin/$COMMAND_NAME"

          test -f "package-root/usr/bin/$COMMAND_NAME"
          test -x "package-root/usr/bin/$COMMAND_NAME"
          test ! -L "package-root/usr/bin/$COMMAND_NAME"

          sudo chown -R "$(id -u):$(id -g)" package-root

      - name: DEB 패키지 생성
        shell: bash
        run: |
          set -euo pipefail
          fpm \
            -s dir \
            -t deb \
            -n "$PACKAGE_NAME" \
            -v "$VERSION" \
            --iteration 1 \
            -a "${{ matrix.debarch }}" \
            --license BSD \
            --vendor "ROKFOSS PROJECT" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            --description "ROKFOSS OpenResty build" \
            -C package-root \
            -p "release/${PACKAGE_NAME}_${VERSION}-1_${{ matrix.debarch }}.deb" \
            .

      - name: RPM 패키지 생성
        shell: bash
        run: |
          set -euo pipefail
          fpm \
            -s dir \
            -t rpm \
            -n "$PACKAGE_NAME" \
            -v "$VERSION" \
            --iteration 1 \
            -a "${{ matrix.rpmarch }}" \
            --license BSD \
            --vendor "ROKFOSS PROJECT" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            --description "ROKFOSS OpenResty build" \
            -C package-root \
            -p "release/${PACKAGE_NAME}-${VERSION}-1.${{ matrix.rpmarch }}.rpm" \
            .

      - name: Arch Linux 패키지 생성
        shell: bash
        run: |
          set -euo pipefail
          fpm \
            -s dir \
            -t pacman \
            -n "$PACKAGE_NAME" \
            -v "$VERSION" \
            --iteration 1 \
            -a "${{ matrix.archarch }}" \
            --license BSD \
            --vendor "ROKFOSS PROJECT" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            --description "ROKFOSS OpenResty build" \
            -C package-root \
            -p "release/${PACKAGE_NAME}-${VERSION}-1-${{ matrix.archarch }}.pkg.tar.zst" \
            .

      - name: 패키지 형식 확인
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --info "release/${PACKAGE_NAME}_${VERSION}-1_${{ matrix.debarch }}.deb" >/dev/null
          rpm -qpi "release/${PACKAGE_NAME}-${VERSION}-1.${{ matrix.rpmarch }}.rpm" >/dev/null
          tar --zstd -tf "release/${PACKAGE_NAME}-${VERSION}-1-${{ matrix.archarch }}.pkg.tar.zst" >/dev/null
          ls -lh release

      - name: 패키지 출처 증명 생성
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: 패키지 아티팩트 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub 릴리스 생성
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read

    steps:
      - name: 패키지 아티팩트 다운로드
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          path: release
          merge-multiple: true

      - name: 패키지 출처 증명 검증
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # 빌드 job 이 만든 증명이 있는 파일만 릴리스한다. 증명이 없거나 다르면 여기서 멈춘다.
          shopt -s nullglob
          files=(release/*.deb release/*.rpm release/*.pkg.tar.zst)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "검증할 패키지가 없습니다."
            exit 1
          fi

          for f in "${files[@]}"; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-release.yml"
          done

      - name: 체크섬 생성
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum *.deb *.rpm *.pkg.tar.zst > checksums.txt
          cat checksums.txt

      - name: 릴리스 정보 결정
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # 앞 job 과 같은 검사를 여기서도 한다. 값이 GITHUB_ENV 로 들어가기 때문이다.
          VERSION_RE='^[0-9A-Za-z][0-9A-Za-z.+~_-]*$'
          if [[ ! "$VERSION" =~ $VERSION_RE ]]; then
            echo "지원하지 않는 버전 형식입니다."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: GitHub 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          NOTE="패키지 출처 검증: gh attestation verify <파일> --repo $GITHUB_REPOSITORY"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "릴리스 $RELEASE_TAG 이(가) 이미 존재합니다."
              exit 1
            fi

            gh release create "$RELEASE_TAG" \
              release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --notes "$NOTE" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" \
              release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes "$NOTE" \
              --generate-notes
          fi
